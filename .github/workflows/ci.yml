name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:playground
      - name: dist/fluent.user.js is up to date
        run: git diff --exit-code -- dist/ || (echo "Run 'npm run build:userscript' and commit dist/" && exit 1)
